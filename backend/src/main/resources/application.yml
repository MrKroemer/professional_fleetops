# =============================================================================
# Configuração base do FleetOps. Tudo que varia por ambiente vem de variável de
# ambiente; este arquivo define apenas o comportamento comum e os padrões seguros.
# =============================================================================
spring:
  application:
    name: fleetops
    version: 0.1.0

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetops}
    username: ${SPRING_DATASOURCE_USERNAME:fleetops}
    password: ${SPRING_DATASOURCE_PASSWORD:fleetops_dev_only}
    hikari:
      pool-name: fleetops-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    # Migração de schema é responsabilidade exclusiva do Flyway. `validate` garante
    # que o mapeamento e o banco não divirjam silenciosamente (Seção 5.2).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
      # Nomes minúsculos nas tabelas do Envers, alinhados às migrações Flyway.
      org.hibernate.envers:
        audit_table_suffix: _aud
        revision_field_name: rev
        revision_type_field_name: revtype
        store_data_at_delete: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      enabled: false

server:
  # Porta interna do processo. A porta publicada no host é controlada separadamente
  # por BACKEND_PORT no docker-compose, para que as duas não se confundam.
  port: ${SERVER_PORT:8080}
  # O backend fica atrás do proxy Nginx; sem isto o IP registrado nas sessões
  # seria sempre o do container do proxy.
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json

fleetops:
  jwt:
    secret: ${FLEETOPS_JWT_SECRET}
    access-ttl: ${FLEETOPS_JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${FLEETOPS_JWT_REFRESH_TTL:P7D}
    cookie-secure: ${FLEETOPS_AUTH_COOKIE_SECURE:false}
  cripto:
    chave: ${FLEETOPS_CRYPTO_KEY}
  cors:
    origens: ${FLEETOPS_CORS_ORIGINS:}
  alertas:
    multa-antecedencia-dias: ${FLEETOPS_ALERTAS_MULTA_ANTECEDENCIA_DIAS:5}
  # Anexos (books fotográficos, CRLV) em storage S3-compatível. Em desenvolvimento o
  # endpoint aponta para o MinIO do Compose; em produção com AWS basta deixá-lo vazio,
  # e o SDK resolve o endereço pela região.
  armazenamento:
    endpoint: ${FLEETOPS_S3_ENDPOINT:http://minio:9000}
    regiao: ${FLEETOPS_S3_REGIAO:us-east-1}
    bucket: ${FLEETOPS_S3_BUCKET:fleetops-anexos}
    chave-de-acesso: ${MINIO_ROOT_USER:fleetops}
    chave-secreta: ${MINIO_ROOT_PASSWORD}
    # 15 MB acomoda a foto de um celular moderno sem obrigar a compressão prévia; a
    # compressão no navegador (Seção 6) reduz na prática para bem menos que isso.
    tamanho-maximo-bytes: ${FLEETOPS_S3_TAMANHO_MAXIMO:15728640}
    tipos-permitidos: ${FLEETOPS_S3_TIPOS:image/jpeg,image/png,image/webp,application/pdf}
    # Vida curta: o link é gerado no momento em que a tela vai exibir a imagem, e não
    # precisa sobreviver à sessão.
    validade-do-link: ${FLEETOPS_S3_VALIDADE_LINK:PT10M}
  # Carga inicial do acervo (cadastros, contratos e operação) a partir das planilhas
  # legadas já extraídas. Desligada por padrão: é uma operação de migração, feita uma vez
  # na primeira subida da instalação. O perfil `dev` a liga; em produção, o operador liga,
  # confere o relatório no log e desliga.
  #
  # Ligá-la com o banco já povoado não faz nada — cada carregador verifica antes se as
  # tabelas que ele preenche estão vazias.
  carga-inicial:
    habilitada: ${FLEETOPS_CARGA_INICIAL:false}

  # Administrador criado apenas em uma instalação sem nenhum usuário. Sem valores
  # padrão: uma senha embutida no código seria uma credencial pública.
  admin-inicial:
    email: ${FLEETOPS_ADMIN_EMAIL:}
    senha: ${FLEETOPS_ADMIN_SENHA:}
    nome: ${FLEETOPS_ADMIN_NOME:Administrador}

logging:
  level:
    root: INFO
    br.com.proyfebrasil.fleetops: INFO
