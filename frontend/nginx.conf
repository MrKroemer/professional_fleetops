server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O upstream é resolvido em tempo de execução, para que o Nginx suba mesmo
    # que o backend ainda esteja iniciando.
    resolver 127.0.0.11 valid=15s ipv6=off;

    # ------------------------------------------------------------------
    # Segurança
    # ------------------------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ------------------------------------------------------------------
    # Compressão
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    client_max_body_size 25m;

    # ------------------------------------------------------------------
    # API — mesma origem que o frontend.
    #
    # Não é otimização: o refresh token é um cookie SameSite=Strict, que o
    # browser só envia quando a API responde na mesma origem da página.
    # ------------------------------------------------------------------
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Documentação da API, útil em homologação.
    location /v3/api-docs {
        set $docs_upstream http://backend:8080;
        proxy_pass $docs_upstream;
        proxy_set_header Host $host;
    }

    # ------------------------------------------------------------------
    # Estáticos
    # ------------------------------------------------------------------

    # Arquivos com hash no nome podem ser cacheados indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index nunca é cacheado: é ele que aponta para os assets novos após um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Roteamento do lado do cliente: qualquer caminho desconhecido devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
